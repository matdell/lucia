# nginx: /etc/nginx/sites-available/lucia.hollywoodsoft.com
server {
    listen 80;
    listen [::]:80;
    server_name lucia.hollywoodsoft.com;

    root /var/www/lucia.hollywoodsoft.com;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
